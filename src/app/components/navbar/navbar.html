<header class="navbar">
  <a class="brand" routerLink="/">Backoffice</a>

  <!-- Los enlaces del backoffice solo los ve un admin. Ocultarlos es comodidad, no seguridad:
       si un user escribe la URL, adminGuard lo devuelve al inicio y la API responde 403 -->
  @if (auth.isAdmin()) {
    <!-- routerLinkActive le pone la clase "active" al enlace de la página en la que estoy -->
    <nav>
      <a routerLink="/authors" routerLinkActive="active">Autores</a>
      <a routerLink="/books" routerLinkActive="active">Libros</a>
    </nav>
  }

  @if (auth.isLoggedIn()) {
    <nav>
      <a routerLink="/chat" routerLinkActive="active">Chat</a>
    </nav>
  }

<!--================================-->
  @if (notificationMessage(); as msg) {
    <div class="presence-toast">
      {{ msg }}
    </div>
  }
<!--================================-->

  <div class="session">
    @if (auth.user(); as user) {
      <span class="user">{{ user.name }} ({{ user.role }})</span>
      <button type="button" class="secondary" (click)="auth.logout()">Cerrar sesión</button>
    } @else {
      <nav>
        <a routerLink="/login" routerLinkActive="active">Iniciar sesión</a>
        <a routerLink="/register" routerLinkActive="active">Registrarse</a>
      </nav>
    }
  </div>
</header>
